      items.push({type:"meal",icon:"🍜",time:fmtTime(t)+" - "+fmtTime(t+70),title:"午餐",desc:"推荐：「"+lf+"」，大众点评评分4.5以上优先"});
      t+=70;lunchHad=true;
    }else if(i<ordered.length-1&&slow){t+=20;}
  });
  if(ordered.length&&t<12*60+15){t=12*60+15;
    var lf2=city.foods&&city.foods.length?city.foods[(dayIdx*2)%city.foods.length]:"当地特色菜";
    items.push({type:"meal",icon:"🍜",time:fmtTime(t)+" - "+fmtTime(t+70),title:"午餐",desc:"推荐：「"+lf2+"」"});t+=70;lunchHad=true;}
  if(!ordered.length){
    items.push({type:"leisure",icon:"🌿",time:fmtTime(t)+" 起",title:"自由活动",
      desc:slow?"节奏舒缓的一天：睡到自然醒，酒店周边散步、咖啡下午茶，附近公园或商业街随意逛逛":"今天行程较松，可自行加购周边半日游，或逛逛当地商圈与市集"});
  }
  if(t<17*60+30)t=17*60+30;
  var df=city.foods&&city.foods.length?city.foods[(dayIdx*2+1)%city.foods.length]:"当地特色菜";
  items.push({type:"meal",icon:"🍲",time:fmtTime(t)+" - "+fmtTime(t+75),title:"晚餐",desc:"推荐：「"+df+"」，建议选在夜间活动附近，省去奔波"});
  t+=75;
  var ePos=curPos(items,hotelPos,ordered,ordered.length);
  if(evening.spot){
    var sp2=evening.spot;
    var leg2=makeLeg(curPos(items,hotelPos,ordered,ordered.length-1+1),sp2,city);
    if(leg2){items.push({type:"move",icon:leg2.icon,time:fmtTime(t)+" · 约"+leg2.mins+"分钟",title:leg2.mode+"前往「"+shortName(sp2.name)+"」",desc:"预计"+leg2.mins+"分钟，人均约"+leg2.cost+"元"});t+=leg2.mins;}
    items.push({type:"spot",icon:"🌃",time:fmtTime(t)+" - "+fmtTime(t+sp2.hours*60),title:sp2.name,spot:sp2,desc:sp2.note||"夜间游览，注意安全"});
    t+=sp2.hours*60;
  }else{
    items.push({type:"meal",icon:"🌃",time:fmtTime(t)+" 起",title:"夜间活动",desc:evening.text});
    t+=90;
  }
  if(dayIdx===days-1&&days>1){
    items.push({type:"info",icon:"✈️",time:fmtTime(Math.max(t+30,15*60)),title:"取行李 · 返程",
      desc:"预留至少2小时前往机场/高铁站"+(inp.fromCity?("，返回"+inp.fromCity):"")+"；特产可在机场/车站或市区超市补齐"});
  }
  return {idx:dayIdx,items:items,area:hotelArea,
    tickets:ordered.reduce(function(a,s2){return a+(s2.ticket||0);},0)+(evening.spot?(evening.spot.ticket||0):0)};
}
function shortName(n){return n.length>12?n.slice(0,12)+"…":n;}
function curPos(items,hotelPos,ordered,i){
  var last=null;
  for(var j=items.length-1;j>=0;j--){if(items[j].type==="spot"){last=items[j].spot.pos;break;}}
  return last||hotelPos;
}

function spotBadges(sp){

    [["门票",p.budget.tickets,"含优惠估算"],["住宿",p.budget.hotel,p.hotel.nights+"晚"],["餐饮",p.budget.food,"¥"+p.city.food+"/人/天"],
     ["市内交通",p.budget.local,""],["往返大交通",p.budget.inter,p.budget.interMode||"未计入"],["备用金",p.budget.buffer,"8%"]]
     .map(function(r){return "<tr><td>"+r[0]+"</td><td>¥"+r[1].toLocaleString()+"</td><td>"+esc(r[2])+"</td></tr>";}).join("")+
    "<tr><th>合计</th><th>¥"+p.budget.total.toLocaleString()+"</th><th>人均 ¥"+p.budget.perPerson.toLocaleString()+"</th></tr></table>";
  h+="<h2>💡 实用贴士</h2>";
  p.tips.forEach(function(t){h+="<p><b>"+t.icon+" "+esc(t.title)+"</b></p><ul>"+t.list.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>";});
  h+="<div class='note'>本攻略由「旅游攻略自动生成器」生成；门票、营业时间与价格均为参考估算，出行前请以景区官方公示为准。</div></body></html>";
  var blob=new Blob(["\ufeff"+h],{type:"text/html;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="旅游攻略_"+p.cityName+"_"+p.inp.days+"天.html";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* ================================================================
 * 表单与事件
 * ================================================================ */
function fillSelect(id,opts,ph){
  var el=document.getElementById(id);el.innerHTML="";
  if(ph!==undefined){var o=document.createElement("option");o.value="";o.textContent=ph;el.appendChild(o);}
  opts.forEach(function(x){var o=document.createElement("option");o.value=x.v!==undefined?x.v:x;o.textContent=x.l!==undefined?x.l:x;el.appendChild(o);});
}
function initForm(){
  fillSelect("dest",Object.keys(CITIES).map(function(k){return {v:k,l:CITIES[k].tagline.split(" · ")[0]+"｜"+k};}),"请选择目的地（或选择“其他城市”）");
  var sel=document.getElementById("dest");
  var o=document.createElement("option");o.value="__custom";o.textContent="🛠 其他城市（手动填写）";sel.appendChild(o);
  fillSelect("fromCity",Object.keys(REGIONS),"不填");
  var hc=document.getElementById("hobbyChips");hc.innerHTML="";
  HOBBIES.forEach(function(hb){
    var c=document.createElement("span");c.className="chip";c.textContent=hb.l;c.dataset.v=hb.k;
    c.onclick=function(){c.classList.toggle("on");};hc.appendChild(c);
  });
  sel.onchange=renderMustChips;
  renderMustChips();
}
function renderMustChips(){
  var wrap=document.getElementById("mustChips");
  var v=document.getElementById("dest").value;
  document.getElementById("customDestWrap").style.display=v==="__custom"?"flex":"none";
  wrap.innerHTML="";
  if(!v){wrap.innerHTML="<span class='hint'>请先选择目的地</span>";return;}
  if(v==="__custom"){wrap.innerHTML="<span class='hint'>未收录城市：请在下方“其他想去的地方”逐个填写必去景点</span>";return;}
  CITIES[v].spots.forEach(function(sp){
    var c=document.createElement("span");c.className="chip";
    c.innerHTML=esc(sp.name)+'<span class="price">'+(sp.ticket?"¥"+sp.ticket:"免费")+"</span>";
    c.dataset.v=sp.name;
    c.onclick=function(){c.classList.toggle("on");};wrap.appendChild(c);
  });
}
function showErr(msg){var e=document.getElementById("errBox");e.style.display="block";e.textContent=msg;e.scrollIntoView({behavior:"smooth",block:"center"});}
function collectInput(){
  var dest=document.getElementById("dest").value;
  var customDestName=document.getElementById("customDest").value.trim();
  if(!dest){return {err:"请选择目的地"};}
  if(dest==="__custom"&&!customDestName){return {err:"请填写目的地城市名称"};}
  var days=+document.getElementById("days").value,people=+document.getElementById("people").value;
  var budget=+document.getElementById("budget").value,avgAge=+document.getElementById("avgAge").value;
  if(!(days>=1&&days<=15))return {err:"旅行天数需在 1-15 天之间"};
  if(!(people>=1&&people<=30))return {err:"旅游人数需在 1-30 人之间"};
  if(!(budget>=100))return {err:"请填写人均预算（≥100 元）"};
  if(!(avgAge>=1&&avgAge<=90))return {err:"请填写人均年龄（1-90）"};
  var hobbies=[];document.querySelectorAll("#hobbyChips .chip.on").forEach(function(c){hobbies.push(c.dataset.v);});
  var mustNames=[];document.querySelectorAll("#mustChips .chip.on").forEach(function(c){mustNames.push(c.dataset.v);});
  var mc=document.getElementById("mustCustom").value.trim();
  if(mc)mc.split(/[、,，;；\n]+/).forEach(function(x){x=x.trim();if(x)mustNames.push(x);});
  return {dest:dest,customDestName:customDestName,fromCity:document.getElementById("fromCity").value,
    startDate:document.getElementById("startDate").value,days:Math.round(days),people:Math.round(people),
    budget:Math.round(budget),budgetTotal:Math.round(budget)*Math.round(people),avgAge:Math.round(avgAge),
    hasKids:document.getElementById("hasKids").checked,hasElderly:document.getElementById("hasElderly").checked,
    hobbies:hobbies,mustNames:mustNames};
}
var LOAD_STEPS=["正在收集景点信息…","正在匹配你的兴趣偏好…","正在规划每日路线与交通…","正在挑选酒店并核算预算…"];
function generate(){
  var inp=collectInput();
  if(inp.err){showErr(inp.err);return;}
  document.getElementById("errBox").style.display="none";
  var ld=document.getElementById("loading");ld.classList.add("show");
  var i=0;
  var stepEl=document.getElementById("loadStep");stepEl.textContent=LOAD_STEPS[0];
  var timer=setInterval(function(){i++;if(i<LOAD_STEPS.length)stepEl.textContent=LOAD_STEPS[i];},260);
  setTimeout(function(){
    clearInterval(timer);
    try{renderPlan(planTrip(inp));}
    catch(e){console.error(e);showErr("生成失败："+e.message);}
    ld.classList.remove("show");
  },1100);
}
document.getElementById("genBtn").onclick=generate;
document.getElementById("sampleBtn").onclick=function(){
  document.getElementById("dest").value="成都";renderMustChips();
  document.getElementById("fromCity").value="西安";
  document.getElementById("days").value=4;document.getElementById("people").value=3;
  document.getElementById("budget").value=2600;document.getElementById("avgAge").value=32;
  document.getElementById("startDate").value="";
  document.getElementById("hasKids").checked=true;
  document.querySelectorAll("#hobbyChips .chip").forEach(function(c){
    c.classList.toggle("on",["food","nature","kid"].indexOf(c.dataset.v)>=0);});
  document.querySelectorAll("#mustChips .chip").forEach(function(c){
    c.classList.toggle("on",["大熊猫繁育研究基地","都江堰景区","锦里古街"].indexOf(c.dataset.v)>=0);});
  document.getElementById("mustCustom").value="";
};
document.getElementById("resetBtn").onclick=function(){
  document.getElementById("dest").value="";renderMustChips();
  document.getElementById("customDest").value="";document.getElementById("fromCity").value="";
  document.getElementById("days").value=4;document.getElementById("people").value=2;
  document.getElementById("budget").value=2500;document.getElementById("avgAge").value=30;
  document.getElementById("startDate").value="";
  document.getElementById("hasKids").checked=false;document.getElementById("hasElderly").checked=false;
  document.querySelectorAll("#hobbyChips .chip").forEach(function(c){c.classList.remove("on");});
  document.getElementById("mustCustom").value="";
  document.getElementById("results").style.display="none";
  document.getElementById("errBox").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("printBtn").onclick=function(){window.print();};
document.getElementById("exportBtn").onclick=function(){if(LAST_PLAN)exportHTML(LAST_PLAN);};
document.querySelectorAll("#tabs .tab").forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll("#tabs .tab").forEach(function(x){x.classList.remove("on");});
    document.querySelectorAll(".tab-panel").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");
    document.getElementById("tab-"+t.dataset.tab).classList.add("on");
  };
});
initForm();
</script>
</body>
</html>
